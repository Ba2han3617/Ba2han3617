# Bu dosyanın repodaki yolu: .github/workflows/stats.yml
# Kartları ortak sunucudan çekmek yerine repo içinde SVG olarak üretir.
name: Generate stats cards

on:
  schedule:
    - cron: "0 3 * * *" # her gün bir kez yeniler
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - InternMatch
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=InternMatch&theme=tokyonight&hide_border=true
          path: profile/pin-internmatch.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - C-to-RISC-V-CODE
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=C-to-RISC-V-CODE&theme=tokyonight&hide_border=true
          path: profile/pin-c-to-riscv.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - Library_System
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Library_System&theme=tokyonight&hide_border=true
          path: profile/pin-library-system.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card - Course_Sharing_System
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Course_Sharing_System&theme=tokyonight&hide_border=true
          path: profile/pin-course-sharing.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
